[workspace]
name = "two-guards"
version = "0.1.0"
description = "Legal domain hallucination benchmarking dataset"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]

[dependencies]
python = ">=3.10"
pixi-pycharm = ">=0.0.11,<0.0.12"
pypdf = ">=6.12.2,<7"
pyspellchecker = ">=0.8.0,<0.9"

[pypi-dependencies]
two-guards = { path = ".", editable = true }
litellm = "*"
pydantic = ">=2.0"
pyyaml = "*"

[feature.dev.pypi-dependencies]
pytest = "*"
pytest-asyncio = "*"

[feature.dev.tasks]
test = "python -m pytest tests/ -v"

[environments]
default = { features = [], solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
