[workspace]
name = "two-guards"
version = "0.1.0"
description = "Legal domain hallucination benchmarking dataset"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]

[dependencies]
python = ">=3.10"

[pypi-dependencies]
two-guards = { path = ".", editable = true }
litellm = "*"
pydantic = ">=2.0"
pyyaml = "*"

[feature.dev.pypi-dependencies]
pytest = "*"
pytest-asyncio = "*"

[environments]
default = { features = [], solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
