Temporal:
    description: "Time-sensitive errors and anachronisms."
    example: "The Build Back Better Act was signed under the Biden presidency in 2017."

Nonsensical:
    description: "Irrelevant responses lacking logic."
    example: "The district court recognized the act was unconstitutional. Cherry blossom season is in the spring."

Relation:
    description: "Incorrect entity relationships."
    example: "The witness Suzie Wilson is the father of James Wilson."

Overclaim:
    description: "Exaggerated or misrepresented facts."
    example: "The case was the most important legal decision of all time."

Unsubstantiated:
    description: "Claim not found in source text."
    example: "Source: Mutual combat is legal in Texas and Washington. Output: Mutual combat is legal in Texas, Washington, and Florida."

Omission:
    description: "Incomplete extraction."
    example: "Source: Party 1 is responsible for recompense of all damages to Party 2, up to $10,000. Output: Party 1 is responsible for recompense of all damages to Party 2."

Granularity:
    description: "Extracting at the wrong level of specificity — whether by abstracting too broadly or by dropping a legally consequential qualifier."
    example: "Source: A fraud statute requiring that the defendant 'knowingly made a false representation.' Output: 'A defendant is liable if they made a false representation.'"

Misattribution:
    description: "Names of people, places, dates, or organizations are incorrect."
    example: "The first president of the United States was Abraham Lincoln."

Anchoring:
    description: "Wrong legal provision."
    example: "Freedom of speech is protected under the Second Amendment of the US Constitution."

Duplication:
    description: "Repeated concept."
    example: "The district court recognized the act was unconstitutional. The district court recognized the act was unconstitutional."
